<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  
  <!-- Off-road Kart Wheel & Track Route Graphics -->
  <g filter="url(#shadow)" stroke="url(#grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Loop Trail Path -->
    <path d="M 120 360 C 90 200, 200 100, 360 140 C 440 160, 420 320, 340 380 C 260 440, 160 420, 120 360 Z" />
    <!-- Kart Roll Cage / Front Symbol -->
    <circle cx="256" cy="256" r="48" fill="#f97316" stroke="#ffffff" stroke-width="12"/>
    <!-- Compass / Crosshair rays -->
    <line x1="256" y1="170" x2="256" y2="190" stroke="#ffffff" stroke-width="8"/>
    <line x1="256" y1="322" x2="256" y2="342" stroke="#ffffff" stroke-width="8"/>
    <line x1="170" y1="256" x2="190" y2="256" stroke="#ffffff" stroke-width="8"/>
    <line x1="322" y1="256" x2="342" y2="256" stroke="#ffffff" stroke-width="8"/>
  </g>

  <!-- Speed Dust Sparks -->
  <circle cx="140" cy="180" r="14" fill="#fbbf24"/>
  <circle cx="390" cy="300" r="18" fill="#fbbf24"/>
  <circle cx="200" cy="400" r="10" fill="#fbbf24"/>
</svg>
